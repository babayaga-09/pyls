[project]
name = "pyls"
version = "0.1.0"
description = "a simple exercise to mimic some behaviours of the `ls` command."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.4.1",
]

[tool.ruff]
line-length = 100
select = ["E", "F"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
